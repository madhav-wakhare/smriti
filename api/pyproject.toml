[project]
name = "smriti"
version = "1.0.0"
description = "Smriti API: A personal tracker for your work and what you learn: plan the day, log time, keep a reading list and revisit ideas. Runs on your computer in one container with one SQLite file."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",   # plain server; the [standard] extras are not needed
    "tzdata==2026.5",    # Alpine has no system zoneinfo
]

[dependency-groups]
dev = [
    "httpx2==2.15.1",    # FastAPI's TestClient
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
